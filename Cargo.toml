[package]
name = "lnsocket-monitor"
version = "0.1.0"
edition = "2024"
description = "Watch a Core Lightning node over commando and print interesting events as JSON lines"
authors = ["William Casarin <jb55@jb55.com>"]
license = "MIT"

[dependencies]
lnsocket = { git = "https://github.com/jb55/lnsocket-rs", branch = "fixes" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
